[package]
name = "passkey-proxy"
version = "0.0.1"
edition = "2021"

[dependencies]
axum = "0.8.8"
axum-cookie = "0.3.0"
base64 = "0.23.1"
bytes = "1.11.1"
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = "1.9.0"
hyper-util = { version = "0.1.20", features = ["tokio","server","http1"] }
p256 = "0.14.0"
sd-notify = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value", "preserve_order"] }
sha2 = "0.11.0"
sqlite = "0.37.4"
tokio = { version = "1.52.3", features = ["rt", "net", "macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["full"] }
uuid = "1.28.0"
webauthn-rs = "0.5.5"
